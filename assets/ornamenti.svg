<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    LIBRERIA ORNAMENTI DEL SITO (tratto sottile, un solo colore = currentColor)
    Uso:  <svg class="orn orn-…" aria-hidden="true"><use href="assets/ornamenti.svg#NOME"/></svg>
    (dentro un articolo il percorso è ../../assets/ornamenti.svg#NOME)
    I tratti hanno pathLength="1": style.css li fa "disegnare" quando compaiono.

    Simboli disponibili:
      rombo          losanga con due punti (separatore generico)
      libro          libro aperto          → tipo di lavoro: saggio, rivista, articolo
      codice         codice rilegato       → tipo di lavoro: manoscritto, scheda di catalogo
      presentazione  schermo su supporto   → tipo di lavoro: seminario, presentazione, slide
      filetto        filetto con losanga   → chiusura dell'articolo
      segnalibro     nastro                → testata degli articoli
      documento      foglio con angolo piegato → riquadri PDF
      monogramma     cerchio con «CDF»     → piè di pagina
  -->

  <symbol id="rombo" viewBox="0 0 40 16">
    <path pathLength="1" d="M20 2 L28 8 L20 14 L12 8 Z"/>
    <path pathLength="1" d="M20 5.5 L24.5 8 L20 10.5 L15.5 8 Z"/>
    <circle cx="4" cy="8" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="36" cy="8" r="1.5" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="libro" viewBox="0 0 32 24">
    <path pathLength="1" d="M16 6 C12 3.6 7.5 3.4 3 5 V20 C7.5 18.4 12 18.6 16 21"/>
    <path pathLength="1" d="M16 6 C20 3.6 24.5 3.4 29 5 V20 C24.5 18.4 20 18.6 16 21"/>
    <path pathLength="1" d="M16 6 V21"/>
    <path pathLength="1" d="M6.5 9.2 C8.8 8.6 11 8.7 13 9.4 M6.5 12.6 C8.8 12 11 12.1 13 12.8 M19 9.4 C21 8.7 23.2 8.6 25.5 9.2 M19 12.8 C21 12.1 23.2 12 25.5 12.6"/>
  </symbol>

  <symbol id="codice" viewBox="0 0 32 24">
    <path pathLength="1" d="M10 2.5 H23 V21.5 H10 C8.3 21.5 7.5 20.6 7.5 19.2 V4.8 C7.5 3.4 8.3 2.5 10 2.5 Z"/>
    <path pathLength="1" d="M12.5 5.5 H20.5 V18.5 H12.5 Z"/>
    <path pathLength="1" d="M16.5 9 L19 12 L16.5 15 L14 12 Z"/>
    <path pathLength="1" d="M23 10.5 H25.5 V13.5 H23"/>
  </symbol>

  <symbol id="presentazione" viewBox="0 0 32 24">
    <path pathLength="1" d="M4.5 3 H27.5 V16 H4.5 Z"/>
    <path pathLength="1" d="M8.5 7 H19 M8.5 10 H23.5 M8.5 13 H15"/>
    <path pathLength="1" d="M16 16 V21 M11 21.5 H21"/>
  </symbol>

  <symbol id="filetto" viewBox="0 0 200 16">
    <path pathLength="1" d="M8 8 H84"/>
    <path pathLength="1" d="M100 2 L108 8 L100 14 L92 8 Z"/>
    <path pathLength="1" d="M116 8 H192"/>
    <circle cx="4" cy="8" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="196" cy="8" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="segnalibro" viewBox="0 0 20 60">
    <path pathLength="1" d="M3 0 V54 L10 47.5 L17 54 V0" fill="currentColor" fill-opacity=".12"/>
    <path pathLength="1" d="M7 0 V40 M13 0 V40" stroke-opacity=".45"/>
  </symbol>

  <symbol id="documento" viewBox="0 0 24 30">
    <path pathLength="1" d="M3 1.5 H15 L21 7.5 V28.5 H3 Z"/>
    <path pathLength="1" d="M15 1.5 V7.5 H21"/>
    <path pathLength="1" d="M7 13 H17 M7 17 H17 M7 21 H12.5"/>
  </symbol>

  <symbol id="monogramma" viewBox="0 0 44 44">
    <circle pathLength="1" cx="22" cy="22" r="20"/>
    <circle pathLength="1" cx="22" cy="22" r="16.5" stroke-opacity=".45"/>
    <text x="22" y="26.2" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="12.5" letter-spacing=".4" fill="currentColor" stroke="none">CDF</text>
  </symbol>
</svg>
